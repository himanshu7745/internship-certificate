<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificate of Internship</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 2rem 1rem;
      background: #f7efe3;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #3b2414;
    }
    img {
      width: 100%;
      max-width: 1000px;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
    }
    p { font-size: 1.1rem; text-align: center; }
    a { color: #8b4513; font-weight: 600; }
    a:hover { color: #5c2d0c; }
  </style>
</head>
<body>
  <img src="certificate.webp" alt="Certificate of Internship">
  <p>For more information visit <a href="https://www.sukrit.org/" target="_blank" rel="noopener">https://www.sukrit.org/</a></p>
</body>
</html>
